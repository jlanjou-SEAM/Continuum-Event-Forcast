<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuum - Event Projection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #2a2a3e 0%, #3d3d52 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            height: calc(100vh - 40px);
        }
        header {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d3d 100%);
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #ff6b6b;
            z-index: 100;
            height: 70px;
        }
        h1 {
            color: #ff6b6b;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #aaa;
            font-size: 11px;
        }
        .main-content {
            margin-top: 90px;
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .left-panel {
            flex: 0 0 80%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }
        .right-panel {
            flex: 0 0 20%;
            background: #1e1e2e;
            border-radius: 8px;
            border-left: 4px solid #ffa500;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .log-title {
            font-weight: bold;
            color: #ffa500;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
        }
        .log-entry {
            font-size: 11px;
            margin-bottom: 8px;
            padding: 6px;
            border-left: 2px solid #666;
            padding-left: 10px;
            color: #bbb;
            line-height: 1.4;
        }
        .log-entry.event {
            border-left-color: #ff6b6b;
            color: #ff6b6b;
        }
        .log-entry.watch {
            border-left-color: #ffa500;
            color: #ffa500;
        }
        .log-entry.warning {
            border-left-color: #ffeb3b;
            color: #ffeb3b;
        }
        .log-timestamp {
            color: #666;
            font-size: 10px;
            margin-right: 8px;
        }
        .event-card {
            background: #1e1e2e;
            border-radius: 8px;
            padding: 30px;
            border-top: 6px solid;
            border-left: 6px solid;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .event-card.event {
            border-top-color: #ff6b6b;
            border-left-color: #ff6b6b;
        }
        .event-card.watch {
            border-top-color: #ffa500;
            border-left-color: #ffa500;
        }
        .event-card.warning {
            border-top-color: #ffeb3b;
            border-left-color: #ffeb3b;
        }
        .card-phase {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .card-phase.event { color: #ff6b6b; }
        .card-phase.watch { color: #ffa500; }
        .card-phase.warning { color: #ffeb3b; }
        .card-type {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .card-location {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 30px;
            line-height: 1.3;
        }
        .card-confidence {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .card-confidence.event { color: #ff6b6b; }
        .card-confidence.watch { color: #ffa500; }
        .card-confidence.warning { color: #ffeb3b; }
        .card-info {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 15px;
        }
        .card-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .card-label {
            color: #888;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
        }
        .card-value {
            color: #fff;
            font-weight: bold;
            text-align: right;
        }
        .empty-state {
            padding: 40px;
            text-align: center;
            color: #666;
        }
        .loading {
            padding: 40px;
            text-align: center;
            color: #aaa;
        }
        .error {
            background: rgba(255,107,107,0.2);
            color: #ff6b6b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ff6b6b;
        }
        footer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1>🎯 CONTINUUM EVENT PROJECTION</h1>
        <p class="subtitle">Real-time natural disaster prediction system • Last refresh: <span id="lastRefresh">-</span></p>
    </header>

    <div class="main-content">
        <div class="left-panel">
            <div id="loading" class="loading" style="display:none;">Loading events...</div>
            <div id="error" class="error" style="display:none;"></div>
            <div id="eventsContainer"></div>
        </div>

        <div class="right-panel">
            <div class="log-title">📋 Live Log</div>
            <div id="logContainer" style="flex: 1; overflow-y: auto;"></div>
        </div>
    </div>

    <footer>Continuum Database • 30-Day Event Tracker</footer>

    <script>
        const REPO = 'jlanjou-SEAM/SEAM-Core';
        const BRANCH = 'main';
        const TRACKER_FILE = 'continuum/event_tracker.json';
        const MANIFOLD_FILE = 'continuum/output/volcanic_manifold_analysis.json';

        let logEntries = [];

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logEntries.unshift({ timestamp, message, type });
            if (logEntries.length > 100) logEntries.pop();

            const logContainer = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="log-timestamp">${timestamp}</span> ${message}`;
            logContainer.insertBefore(entry, logContainer.firstChild);
        }

        function getPhase(seam_phi) {
            if (seam_phi > 0.90) return 'event';
            if (seam_phi > 0.85) return 'watch';
            if (seam_phi > 0.75) return 'warning';
            return 'track';
        }

        function formatLocation(loc) {
            if (!loc) return 'Unknown';
            const parts = [loc.city, loc.county_district, loc.state_province, loc.country].filter(Boolean);
            if (parts.length > 0) return parts.join(', ');
            // Fallback to lat/lon if location hierarchy unavailable
            if (loc.best_effort_lat && loc.best_effort_lon) {
                return `${loc.best_effort_lat.toFixed(2)}, ${loc.best_effort_lon.toFixed(2)}`;
            }
            return 'TBD';
        }

        function createEventCard(eventData, phase) {
            const lastConf = eventData.confidence_history[eventData.confidence_history.length - 1];
            const conf = lastConf ? (lastConf.seam_phi * 100).toFixed(0) : 'N/A';
            const mag = lastConf && lastConf.magnitude ? lastConf.magnitude : null;
            const location = formatLocation(eventData.location) || 'TBD';

            const card = document.createElement('div');
            card.className = `event-card ${phase}`;

            const magDisplay = mag ? `<div class="card-info-row"><span class="card-label">Magnitude</span><span class="card-value">${mag}</span></div>` : '';

            card.innerHTML = `
                <div>
                    <div class="card-phase">${phase === 'event' ? '🔴 EVENT' : '🟠 WATCH'}</div>
                    <div class="card-type">${eventData.signature_class}</div>
                    <div class="card-location">${location}</div>
                </div>

                <div>
                    <div class="card-confidence ${phase}">${conf}%</div>
                    <div class="card-info">
                        <div class="card-info-row">
                            <span class="card-label">Detected</span>
                            <span class="card-value">${new Date(eventData.first_detected_utc).toLocaleTimeString()}</span>
                        </div>
                        <div class="card-info-row">
                            <span class="card-label">Status</span>
                            <span class="card-value">${eventData.status.toUpperCase()}</span>
                        </div>
                        ${magDisplay}
                        <div class="card-info-row">
                            <span class="card-label">Precision</span>
                            <span class="card-value">${eventData.location.best_effort_lat ? '🎯 LOCKED' : '📍 Pending'}</span>
                        </div>
                    </div>
                </div>
            `;

            return card;
        }

        async function loadAndRender() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const container = document.getElementById('eventsContainer');

            loading.style.display = 'block';
            error.style.display = 'none';

            try {
                let allEvents = [];

                // Try tracker first
                try {
                    const trackerUrl = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${TRACKER_FILE}`;
                    const trackerResponse = await fetch(trackerUrl);
                    if (trackerResponse.ok) {
                        const tracker = await trackerResponse.json();
                        const trackerEvents = Object.values(tracker.events || {});
                        if (trackerEvents.length > 0) {
                            allEvents = trackerEvents;
                            addLog(`📊 Loaded ${allEvents.length} events from tracker (30-day history)`, 'info');
                        }
                    }
                } catch (e) {
                    console.log('Tracker not available, trying manifold...');
                }

                // If tracker empty, use manifold
                if (allEvents.length === 0) {
                    const manifoldUrl = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${MANIFOLD_FILE}`;
                    const manifoldResponse = await fetch(manifoldUrl);
                    if (!manifoldResponse.ok) throw new Error(`HTTP ${manifoldResponse.status}`);

                    const manifold = await manifoldResponse.json();
                    const manifoldEvents = manifold.manifold_events || manifold.matches || [];

                    // Convert manifold events to tracker format for display
                    allEvents = manifoldEvents.map(e => ({
                        event_id: e.event_id,
                        signature_class: e.signature_class,
                        primary_regime: e.primary_regime,
                        first_detected_utc: e.timestamp_utc,
                        status: 'active',
                        location: {
                            best_effort_lat: e.latitude,
                            best_effort_lon: e.longitude,
                            region: e.spatial_region || null,
                            country: null,
                            state_province: null,
                            county_district: null,
                            city: null
                        },
                        signal_summary: e.signal_summary,
                        source_refs: e.source_refs || [],
                        confidence_history: [{
                            timestamp_utc: e.timestamp_utc,
                            seam_phi: e.seam_phi,
                            phase: getPhase(e.seam_phi),
                            magnitude: e.magnitude
                        }]
                    }));

                    addLog(`📊 Loaded ${allEvents.length} events from LIVE MANIFOLD (127 signatures)`, 'warning');
                }

                if (allEvents.length === 0) {
                    container.innerHTML = '<div class="empty-state">No events yet. Waiting for data...</div>';
                    loading.style.display = 'none';
                    return;
                }

                // Get only EVENT and WATCH phases
                const criticalEvents = allEvents.filter(evt => {
                    if (evt.confidence_history && evt.confidence_history.length > 0) {
                        const lastConf = evt.confidence_history[evt.confidence_history.length - 1].seam_phi;
                        return lastConf > 0.85;
                    }
                    return false;
                }).sort((a, b) => {
                    const aConf = a.confidence_history[a.confidence_history.length - 1].seam_phi;
                    const bConf = b.confidence_history[b.confidence_history.length - 1].seam_phi;
                    return bConf - aConf;
                });

                addLog(`⚠️ ${criticalEvents.length} critical events (>85% confidence)`, 'warning');

                if (criticalEvents.length === 0) {
                    container.innerHTML = '<div class="empty-state">No critical events. System nominal.</div>';
                    loading.style.display = 'none';
                    document.getElementById('lastRefresh').textContent = new Date().toLocaleTimeString();
                    return;
                }

                container.innerHTML = '';
                criticalEvents.slice(0, 2).forEach((evt, idx) => {
                    const lastConf = evt.confidence_history[evt.confidence_history.length - 1].seam_phi;
                    const phase = getPhase(lastConf);
                    const card = createEventCard(evt, phase);
                    container.appendChild(card);

                    addLog(`${phase === 'event' ? '🔴' : '🟠'} ${evt.signature_class.toUpperCase()} at ${formatLocation(evt.location)} - ${(lastConf*100).toFixed(0)}%`, phase);
                });

                loading.style.display = 'none';
                document.getElementById('lastRefresh').textContent = new Date().toLocaleTimeString();

            } catch (err) {
                error.style.display = 'block';
                error.textContent = `Error: ${err.message}`;
                loading.style.display = 'none';
                addLog(`❌ Error: ${err.message}`, 'error');
            }
        }

        addLog('🚀 Continuum Event Projection System started', 'info');
        loadAndRender();
        setInterval(loadAndRender, 60000);
    </script>
</body>
</html>
