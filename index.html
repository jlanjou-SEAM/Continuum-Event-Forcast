<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuum - Event Projection System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2a2a3e 0%, #3d3d52 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        header {
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d3d 100%);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #ff6b6b;
        }
        h1 { color: #ff6b6b; margin-bottom: 10px; }
        .subtitle { color: #aaa; font-size: 14px; }
        .phase-section { margin-bottom: 40px; }
        .phase-header {
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px;
            padding-bottom: 15px; border-bottom: 2px solid;
        }
        .phase-header.event { border-bottom-color: #ff6b6b; }
        .phase-header.watch { border-bottom-color: #ffa500; }
        .phase-header.warning { border-bottom-color: #ffeb3b; }
        .phase-header.track { border-bottom-color: #666; }
        .phase-icon { font-size: 28px; }
        .phase-title { font-size: 22px; font-weight: bold; }
        .phase-count { margin-left: auto; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px; }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .event-card {
            background: #1e1e2e;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid;
            border-top: 4px solid;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .event-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(255,107,107,0.2); }
        .event-card.event { border-left-color: #ff6b6b; border-top-color: #ff6b6b; }
        .event-card.watch { border-left-color: #ffa500; border-top-color: #ffa500; }
        .event-card.warning { border-left-color: #ffeb3b; border-top-color: #ffeb3b; }
        .event-card.track { border-left-color: #666; border-top-color: #666; }
        .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; }
        .event-type {
            background: rgba(255,107,107,0.2);
            color: #ff6b6b;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .confidence-badge {
            background: #ff6b6b;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
        }
        .confidence-badge.watch { background: #ffa500; }
        .confidence-badge.warning { background: #ffeb3b; color: #000; }
        .event-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 12px; }
        .location-hierarchy {
            background: rgba(255,165,0,0.1);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 3px solid #ffa500;
            font-size: 12px;
            line-height: 1.6;
        }
        .location-hierarchy strong { color: #ffa500; }
        .location-precision {
            font-size: 11px;
            color: #888;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .confidence-history {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            border-left: 3px solid #2196f3;
            font-size: 12px;
        }
        .history-title { font-weight: bold; color: #2196f3; margin-bottom: 8px; }
        .history-entry {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #aaa;
        }
        .history-entry:last-child { border-bottom: none; }
        .history-conf { color: #fff; font-weight: bold; }
        .time-tracking {
            background: rgba(255,107,107,0.1);
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #ff6b6b;
            font-size: 12px;
        }
        .time-tracking-row { display: flex; justify-content: space-between; margin: 4px 0; }
        .time-label { color: #888; }
        .time-value { color: #ff6b6b; font-weight: bold; }
        .track-list { background: #1e1e2e; border-radius: 8px; border-left: 4px solid #666; }
        .track-item {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .track-item:last-child { border-bottom: none; }
        .track-type { color: #aaa; font-weight: 600; min-width: 120px; }
        .track-location { color: #ccc; flex: 1; margin: 0 20px; }
        .track-conf { color: #ffa500; font-weight: bold; margin-right: 20px; }
        .empty-state { text-align: center; padding: 40px; color: #666; background: #1e1e2e; border-radius: 8px; }
        footer { text-align: center; color: #666; margin-top: 40px; font-size: 12px; }
        .loading { text-align: center; padding: 40px; color: #aaa; }
        .error {
            background: rgba(255,107,107,0.2);
            color: #ff6b6b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Continuum Event Projection System</h1>
            <p class="subtitle">Real-time natural disaster prediction with 30-day event tracking</p>
        </header>

        <div id="loading" class="loading" style="display:none;">Loading event data...</div>
        <div id="error" class="error" style="display:none;"></div>

        <div id="eventPhase" class="phase-section"></div>
        <div id="watchPhase" class="phase-section"></div>
        <div id="warningPhase" class="phase-section"></div>
        <div id="trackPhase" class="phase-section"></div>

        <footer>
            <p>Continuum Database • Event Projection System with 30-Day Rolling Tracker</p>
            <p>Last refresh: <span id="lastRefresh">-</span></p>
        </footer>
    </div>

    <script>
        const REPO = 'jlanjou-SEAM/SEAM-Core';
        const BRANCH = 'main';
        const TRACKER_FILE = 'continuum/event_tracker.json';

        function getFileUrl(file) {
            return `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${file}`;
        }

        function getPhase(seam_phi) {
            if (seam_phi > 0.90) return 'event';
            if (seam_phi > 0.85) return 'watch';
            if (seam_phi > 0.75) return 'warning';
            if (seam_phi > 0.50) return 'track';
            return 'unknown';
        }

        function formatLocation(loc) {
            if (!loc) return 'Unknown';
            const parts = [loc.city, loc.county_district, loc.state_province, loc.country, loc.region].filter(Boolean);
            return parts.join(' › ');
        }

        function formatPrecision(lat, lon) {
            if (lat !== null && lon !== null) {
                return `Precision: ${lat.toFixed(4)}°, ${lon.toFixed(4)}°`;
            }
            return 'Location pending';
        }

        function createEventCard(eventData, phase) {
            const lastConf = eventData.confidence_history[eventData.confidence_history.length - 1];
            const conf = lastConf ? (lastConf.seam_phi * 100).toFixed(0) : 'N/A';

            const card = document.createElement('div');
            card.className = `event-card ${phase}`;

            const historyHtml = eventData.confidence_history.slice(-5).map((h, idx) => `
                <div class="history-entry">
                    <span>${new Date(h.timestamp_utc).toLocaleTimeString()}</span>
                    <span class="history-conf">${(h.seam_phi * 100).toFixed(0)}%</span>
                </div>
            `).join('');

            const timeTracking = eventData.identification_to_alert_minutes
                ? `<div class="time-tracking-row"><span class="time-label">Identification → Alert:</span><span class="time-value">+${eventData.identification_to_alert_minutes}m</span></div>`
                : '';

            card.innerHTML = `
                <div class="card-header">
                    <span class="event-type">${eventData.signature_class}</span>
                    <span class="confidence-badge ${phase}">${conf}%</span>
                </div>

                <div class="event-title">${eventData.location.city || eventData.location.region || 'Event'}</div>

                <div class="location-hierarchy">
                    <strong>📍 Location Hierarchy</strong>
                    <div>${formatLocation(eventData.location)}</div>
                    <div class="location-precision">${formatPrecision(eventData.location.best_effort_lat, eventData.location.best_effort_lon)}</div>
                </div>

                <div class="confidence-history">
                    <div class="history-title">📊 Confidence Progression (Last 5)</div>
                    ${historyHtml}
                </div>

                ${eventData.identification_to_alert_minutes !== null ? `
                    <div class="time-tracking">
                        <div class="time-label">⏱️ Detection Timeline</div>
                        <div class="time-tracking-row"><span>First Detected:</span><span>${new Date(eventData.first_detected_utc).toLocaleString()}</span></div>
                        ${timeTracking}
                    </div>
                ` : ''}

                <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 11px; color: #888;">
                    Event ID: ${eventData.event_id}<br>
                    Status: ${eventData.status}
                </div>
            `;

            return card;
        }

        async function loadAndRender() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');

            loading.style.display = 'block';
            error.style.display = 'none';

            try {
                const response = await fetch(getFileUrl(TRACKER_FILE));
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const tracker = await response.json();
                const allEvents = Object.values(tracker.events || {});

                // Group by phase (use last confidence entry)
                const phases = { event: [], watch: [], warning: [], track: [] };

                allEvents.forEach(evt => {
                    if (evt.confidence_history && evt.confidence_history.length > 0) {
                        const lastConf = evt.confidence_history[evt.confidence_history.length - 1].seam_phi;
                        const phase = getPhase(lastConf);
                        phases[phase].push(evt);
                    }
                });

                // Render phases
                renderPhase('eventPhase', phases.event, 'event', '🔴 EVENT PHASE', 'Point of No Return (>90%)');
                renderPhase('watchPhase', phases.watch, 'watch', '🟠 WATCH PHASE', 'Approaching Critical (>85%)');
                renderPhase('warningPhase', phases.warning, 'warning', '🟡 WARNING PHASE', 'Early Signals (>75%)');
                renderTrackPhase('trackPhase', phases.track);

                document.getElementById('lastRefresh').textContent = new Date().toLocaleTimeString();
                loading.style.display = 'none';

            } catch (err) {
                error.style.display = 'block';
                error.textContent = `Error: ${err.message}`;
                loading.style.display = 'none';
            }
        }

        function renderPhase(elementId, events, phase, title, subtitle) {
            const container = document.getElementById(elementId);

            if (events.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = `
                <div class="phase-header ${phase}">
                    <div class="phase-icon">${phase === 'event' ? '🔴' : phase === 'watch' ? '🟠' : '🟡'}</div>
                    <div>
                        <div class="phase-title">${title}</div>
                        <div class="subtitle">${subtitle}</div>
                    </div>
                    <div class="phase-count">${events.length}</div>
                </div>
                <div class="cards-grid">
            `;

            events.forEach(evt => {
                const card = createEventCard(evt, phase);
                html += card.outerHTML;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        function renderTrackPhase(elementId, events) {
            const container = document.getElementById(elementId);

            if (events.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = `
                <div class="phase-header track">
                    <div class="phase-icon">📋</div>
                    <div>
                        <div class="phase-title">📋 TRACK PHASE</div>
                        <div class="subtitle">Background Monitoring (>50%)</div>
                    </div>
                    <div class="phase-count">${events.length}</div>
                </div>
                <div class="track-list">
            `;

            events.forEach(evt => {
                const lastConf = evt.confidence_history[evt.confidence_history.length - 1];
                const conf = lastConf ? (lastConf.seam_phi * 100).toFixed(0) : 'N/A';
                html += `
                    <div class="track-item">
                        <span class="track-type">${evt.signature_class}</span>
                        <span class="track-location">${formatLocation(evt.location)}</span>
                        <span class="track-conf">${conf}%</span>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        loadAndRender();
        setInterval(loadAndRender, 60000);
    </script>
</body>
</html>
