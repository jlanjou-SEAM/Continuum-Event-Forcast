name: Event-Forcast Process (Every Minute)

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Clone backend processor
        run: |
          git clone --depth 1 https://github.com/jlanjou-SEAM/seam-private-engines.git /tmp/engines

      - name: Update event tracker from manifold
        env:
          PUBLIC_REPO_PATH: ${{ github.workspace }}
        run: |
          python /tmp/engines/event-forcast/backend_processor_live.py

      - name: Commit and push updated tracker
        run: |
          cd ${{ github.workspace }}
          git config user.name "SEAM Processor"
          git config user.email "processor@github.local"
          git add continuum/event_tracker.json
          if ! git diff --quiet --cached; then
            git commit -m "chore: update event register from manifold [skip ci]"
            git push origin main
          fi
