name: Nonrealtime Acquisition (5min cycle)

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nonrealtime-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser urllib3

      - name: Run nonrealtime acquisition
        env:
          SEAM_COLLECTOR_TIMEOUT_SECONDS: 60
        run: |
          cd config/step1_raw_data_retrieval
          python nonrealtime_acquisition.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: nonrealtime acquisition update [skip ci]"
            git push
          fi
