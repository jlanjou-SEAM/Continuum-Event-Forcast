name: Event-Forcast Collect (Realtime)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Clone private engine
        run: |
          git clone --depth 1 https://${{ secrets.GITHUB_TOKEN }}@github.com/jlanjou-SEAM/seam-private-engines.git /tmp/engines

      - name: Run realtime collectors
        env:
          SEAM_OUTPUT_ROOT: ${{ github.workspace }}
          SEAM_RETRIEVAL_MODE: live
          SEAM_BACKFILL_HOURS: 0
        run: |
          cd /tmp/engines/event-forcast/step1_raw_data_retrieval
          python realtime_acquisition.py

      - name: Commit and push results
        run: |
          cd ${{ github.workspace }}
          git config user.name "SEAM Bot"
          git config user.email "seam@github.local"
          git add -A realtime/ nonrealtime/ official/ streams/ state/
          if ! git diff --quiet --cached; then
            git commit -m "chore: realtime data collection [skip ci]"
            git push origin main
          fi
