name: Autonomous SEAM Orchestrator

on:
  schedule:
    # Run every 5 minutes - GitHub minimum is 5 min, this is as frequent as possible
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Manual trigger button on GitHub UI

permissions:
  contents: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser urllib3

      - name: Run SEAM Autonomous Orchestrator
        run: |
          python seam_orchestrator.py

      - name: Verify and commit results
        if: always()
        run: |
          git config user.name "seam-orchestrator[bot]"
          git config user.email "seam-orchestrator@github.local"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "chore: autonomous orchestrator update [skip ci]"
            git push origin main
          fi
