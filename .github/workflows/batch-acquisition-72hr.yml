name: Batch Acquisition 72hr Window

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batch-72hr:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser urllib3 pillow

      - name: Run realtime 72hr acquisition
        env:
          SEAM_COLLECTOR_TIMEOUT_SECONDS: 45
        run: |
          cd config/step1_raw_data_retrieval
          python realtime_acquisition_72hr.py

      - name: Run nonrealtime 72hr acquisition
        env:
          SEAM_COLLECTOR_TIMEOUT_SECONDS: 60
        run: |
          cd config/step1_raw_data_retrieval
          python nonrealtime_acquisition_72hr.py

      - name: Run official 72hr acquisition
        env:
          SEAM_COLLECTOR_TIMEOUT_SECONDS: 45
        run: |
          cd config/step1_raw_data_retrieval
          python official_acquisition_72hr.py

      - name: Run image stream 72hr acquisition
        env:
          SEAM_COLLECTOR_TIMEOUT_SECONDS: 60
        run: |
          cd config/step1_raw_data_retrieval
          python image_stream_acquisition_72hr.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: batch 72hr acquisition cycle [skip ci]"
            git push
          fi
