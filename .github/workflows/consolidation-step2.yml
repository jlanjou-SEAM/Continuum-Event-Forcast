name: Step 2 - Consolidation (Every 1min)

on:
  schedule:
    - cron: '*/1 * * * *'  # Every minute
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser urllib3

      - name: Run Step 2 Consolidation
        run: |
          cd config/step2_continuum_master
          python step2_continuum_master.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: step 2 consolidation update [skip ci]"
            git push
          fi
