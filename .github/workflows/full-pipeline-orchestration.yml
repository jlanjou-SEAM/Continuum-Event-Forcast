name: Full Pipeline Orchestration

on:
  schedule:
    - cron: '0 4 * * 0'  # Weekly on Sunday at 4 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 feedparser urllib3 pillow numpy scipy

      - name: '[Step 1] Run all realtime acquisitions (72hr + 168hr)'
        env:
          SEAM_COLLECTOR_TIMEOUT_SECONDS: 45
        run: |
          cd config/step1_raw_data_retrieval
          echo "Running 72hr realtime acquisition..."
          python realtime_acquisition_72hr.py
          echo "Running 168hr realtime acquisition..."
          python realtime_acquisition_168hr.py

      - name: '[Step 1] Run all nonrealtime acquisitions (72hr + 168hr)'
        env:
          SEAM_COLLECTOR_TIMEOUT_SECONDS: 60
        run: |
          cd config/step1_raw_data_retrieval
          echo "Running 72hr nonrealtime acquisition..."
          python nonrealtime_acquisition_72hr.py
          echo "Running 168hr nonrealtime acquisition..."
          python nonrealtime_acquisition_168hr.py

      - name: '[Step 1] Run all official acquisitions (72hr + 168hr)'
        env:
          SEAM_COLLECTOR_TIMEOUT_SECONDS: 45
        run: |
          cd config/step1_raw_data_retrieval
          echo "Running 72hr official acquisition..."
          python official_acquisition_72hr.py
          echo "Running 168hr official acquisition..."
          python official_acquisition_168hr.py

      - name: '[Step 1] Run all image stream acquisitions (72hr + 168hr)'
        env:
          SEAM_COLLECTOR_TIMEOUT_SECONDS: 60
        run: |
          cd config/step1_raw_data_retrieval
          echo "Running 72hr image streams..."
          python image_stream_acquisition_72hr.py
          echo "Running 168hr image streams..."
          python image_stream_acquisition_168hr.py

      - name: '[Step 5] Run native reconciliation'
        run: |
          cd continuum/processes/step5_recursive_official_analysis
          python step5_native_reconciliation.py
        continue-on-error: true

      - name: Commit all changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: full pipeline orchestration cycle (weekly) [skip ci]"
            git push
          fi

      - name: Generate validation report
        if: always()
        run: |
          echo "## Pipeline Execution Report" > pipeline_report.md
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> pipeline_report.md
          echo "" >> pipeline_report.md
          echo "### Steps Executed" >> pipeline_report.md
          echo "- [x] Realtime 72hr/168hr acquisition" >> pipeline_report.md
          echo "- [x] Nonrealtime 72hr/168hr acquisition" >> pipeline_report.md
          echo "- [x] Official 72hr/168hr acquisition" >> pipeline_report.md
          echo "- [x] Image streams 72hr/168hr acquisition" >> pipeline_report.md
          echo "- [x] Step5 native reconciliation" >> pipeline_report.md
          cat pipeline_report.md
